services:
  - type: web
    name: community-share-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: community-share-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: community-share-db
    databaseName: community_share
    plan: free
