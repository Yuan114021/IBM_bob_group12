<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>需求登記 — 社區關懷平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 導覽列 -->
  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="text-lg font-bold text-blue-600">🏘️ 社區關懷平台</a>
      <div class="flex gap-5 text-sm text-gray-600">
        <a href="needs.html" class="nav-link active">需求登記</a>
        <a href="matching.html" class="nav-link hover:text-blue-600">志工媒合</a>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">需求登記</h1>
    <p class="text-sm text-gray-500 mb-8">您的資料將以匿名代號保護，送出後由志工/里長審核。</p>

    <form id="needsForm" class="bg-white rounded-2xl border border-gray-200 p-8 space-y-6">

      <!-- 需求類型 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">需求類型 <span class="text-red-500">*</span></label>
        <select id="needType" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
          <option value="">請選擇需求類型</option>
          <option value="生活物資">生活物資</option>
          <option value="就醫陪同">就醫陪同</option>
          <option value="日常陪伴">日常陪伴</option>
          <option value="家務協助">家務協助</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- 物資細項（動態顯示） -->
      <div id="supplySection" class="hidden space-y-4 bg-blue-50 rounded-xl p-4 border border-blue-100">
        <p class="text-xs font-semibold text-blue-700 uppercase tracking-wide">物資細項</p>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">物資類別 <span class="text-red-500">*</span></label>
          <select id="supplyCategory"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="">請選擇物資類別</option>
            <option value="食物/飲水">食物／飲水</option>
            <option value="日用品">日用品</option>
            <option value="藥品">藥品</option>
            <option value="衣物">衣物</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">數量／說明</label>
          <input type="text" id="supplyQty" placeholder="例：白米 5 公斤、感冒藥一週份"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">緊急程度</label>
          <div class="flex gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="urgency" value="一般" checked class="accent-green-500" />
              <span class="badge-normal">一般</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="urgency" value="緊急" class="accent-red-500" />
              <span class="badge-urgent">緊急</span>
            </label>
          </div>
        </div>
      </div>

      <!-- 需求說明 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">需求說明</label>
        <textarea id="needDesc" rows="3" placeholder="請簡單描述您的需求（選填）"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none"></textarea>
      </div>

      <!-- 聯絡方式 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">聯絡方式 <span class="text-gray-400 text-xs">（選填，僅審核人員可見）</span></label>
        <input type="text" id="needContact" placeholder="電話或其他聯絡方式"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 text-sm transition">
        送出需求登記
      </button>
    </form>
  </main>

  <!-- 成功 Modal -->
  <div id="successModal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center shadow-xl">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">登記成功！</h2>
      <p class="text-sm text-gray-500 mb-4">您的匿名代號為</p>
      <div id="anonymousId" class="text-2xl font-bold text-blue-600 bg-blue-50 rounded-xl py-3 px-6 mb-4 tracking-wide"></div>
      <p class="text-xs text-gray-400 mb-6">請記下此代號，可用於查詢審核狀態。<br/>需求將由志工/里長審核後公告。</p>
      <button onclick="closeModal()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-2 text-sm transition">
        確認
      </button>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/needs.js"></script>
</body>
</html>
