<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>匿名聊天室 — 社區關懷平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/utils.js"></script>
  <script>document.addEventListener('DOMContentLoaded', applyGlobalFontSize);</script>
  <style>
    #messageList { scroll-behavior: smooth; }
    .msg-bubble-me    { background:#dbeafe; border-radius:18px 18px 4px 18px; }
    .msg-bubble-other { background:#f3f4f6; border-radius:18px 18px 18px 4px; }
    .msg-system       { background:#fefce8; border-radius:12px; color:#854d0e; font-size:.75rem; text-align:center; padding:4px 16px; display:inline-block; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- 導覽列 -->
  <nav class="bg-white border-b border-gray-200 shadow-sm shrink-0">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="text-lg font-bold text-blue-600">🏘️ 社區關懷平台</a>
      <span class="text-sm text-gray-500" id="navRoomId"></span>
    </div>
  </nav>

  <!-- 進入聊天室 / 選擇身份 -->
  <div id="entryPanel" class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="bg-white rounded-2xl border border-gray-200 p-8 w-full max-w-md space-y-5">
      <div class="text-3xl text-center mb-2">💬</div>
      <h1 class="text-xl font-bold text-gray-800 text-center">進入匿名聊天室</h1>
      <p class="text-sm text-gray-500 text-center">雙方以代號溝通，保護個人隱私。</p>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">需求代號 / 配對編號 <span class="text-red-500">*</span></label>
        <input type="text" id="roomIdInput" placeholder="例：愛心居民 #A382 或 MATCH_001"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
        <p class="text-xs text-gray-400 mt-1">雙方輸入相同代號即可進入同一聊天室。</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">我的身份</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="radio" name="myRole" value="居民" checked class="accent-blue-600" />
            <span class="text-sm">🏠 我是居民</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="radio" name="myRole" value="志工" class="accent-purple-600" />
            <span class="text-sm">🙋 我是志工</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">您的暱稱（選填）</label>
        <input type="text" id="nicknameInput" placeholder="預設使用代號，可自訂暱稱"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <button id="enterBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 text-sm transition">
        進入聊天室
      </button>
    </div>
  </div>

  <!-- 聊天室主體 -->
  <div id="chatPanel" class="hidden flex-1 flex flex-col max-w-2xl w-full mx-auto">

    <!-- 聊天室標題列 -->
    <div class="bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 shrink-0">
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-gray-800 text-sm truncate" id="chatRoomTitle"></div>
        <div class="text-xs text-gray-400" id="chatMyRole"></div>
      </div>
      <button id="shareContactBtn"
        class="shrink-0 text-xs bg-green-50 border border-green-200 text-green-700 hover:bg-green-100 font-semibold px-3 py-1.5 rounded-lg transition">
        📞 交換聯絡方式
      </button>
      <button id="clearBtn"
        class="shrink-0 text-xs text-gray-400 hover:text-red-500 transition">清除</button>
    </div>

    <!-- 訊息列表 -->
    <div id="messageList" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-gray-50"
         style="min-height:0; max-height:calc(100vh - 220px);">
      <!-- 訊息由 JS 渲染 -->
    </div>

    <!-- 輸入區 -->
    <div class="bg-white border-t border-gray-200 px-4 py-3 flex gap-3 shrink-0">
      <input type="text" id="msgInput"
        placeholder="輸入訊息… (Enter 送出)"
        class="flex-1 border border-gray-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      <button id="sendBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl px-5 py-2 text-sm transition">
        送出
      </button>
    </div>
  </div>

  <!-- 交換聯絡方式 Modal -->
  <div id="contactModal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-gray-800">📞 交換聯絡方式</h2>
      <p class="text-sm text-gray-500">填入您願意分享的聯絡資訊，訊息將傳送到聊天室，由對方自行決定是否回覆。</p>
      <textarea id="contactText" rows="3"
        placeholder="例：可加 LINE ID: xxxx，或電話 0912-xxx-xxx"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 resize-none"></textarea>
      <div class="flex gap-3">
        <button id="sendContactBtn"
          class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl py-2 text-sm transition">
          傳送
        </button>
        <button onclick="document.getElementById('contactModal').classList.add('hidden')"
          class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl py-2 text-sm transition">
          取消
        </button>
      </div>
    </div>
  </div>

  <script src="../js/chat.js"></script>
</body>
</html>
