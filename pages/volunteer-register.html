<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>志工登記 — 社區關懷平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/utils.js"></script>
  <script>document.addEventListener('DOMContentLoaded', applyGlobalFontSize);</script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="text-lg font-bold text-blue-600">🏘️ 社區關懷平台</a>
      <a href="matching.html" class="text-sm text-gray-500 hover:text-blue-600">← 返回媒合首頁</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div class="flex items-center gap-3 mb-1">
      <span class="text-3xl">🙋</span>
      <h1 class="text-2xl font-bold text-gray-800">志工服務登記</h1>
    </div>
    <p class="text-sm text-gray-500 mb-8 ml-12">請填寫您可提供的服務項目、時段，並完成身份認證。</p>

    <form id="volunteerForm" class="bg-white rounded-2xl border border-gray-200 p-8 space-y-6">

      <!-- 姓名 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">姓名 <span class="text-red-500">*</span></label>
        <input type="text" id="volName" required placeholder="您的姓名"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <!-- 聯絡電話 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">聯絡電話 <span class="text-red-500">*</span></label>
        <input type="tel" id="volPhone" required placeholder="0912-345-678"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <!-- 可提供的服務 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">可提供的服務 <span class="text-red-500">*</span>（可複選）</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volService" value="聊天陪伴" class="accent-blue-600" />
            <span class="text-sm">💬 聊天陪伴</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volService" value="散步" class="accent-blue-600" />
            <span class="text-sm">🚶 散步</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volService" value="陪同看診" class="accent-blue-600" />
            <span class="text-sm">🏥 陪同看診</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volService" value="代買物資" class="accent-blue-600" />
            <span class="text-sm">🛒 代買物資</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition col-span-2">
            <input type="checkbox" name="volService" value="家務協助" class="accent-blue-600" />
            <span class="text-sm">🏠 家務協助</span>
          </label>
        </div>
      </div>

      <!-- 可配合時段 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">可配合的時段 <span class="text-red-500">*</span>（可複選）</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volTime" value="平日上午" class="accent-blue-600" />
            <span class="text-sm">平日上午</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volTime" value="平日下午" class="accent-blue-600" />
            <span class="text-sm">平日下午</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volTime" value="平日晚上" class="accent-blue-600" />
            <span class="text-sm">平日晚上</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition">
            <input type="checkbox" name="volTime" value="假日上午" class="accent-blue-600" />
            <span class="text-sm">假日上午</span>
          </label>
          <label class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 p-3 cursor-pointer hover:border-blue-300 transition col-span-2">
            <input type="checkbox" name="volTime" value="假日下午" class="accent-blue-600" />
            <span class="text-sm">假日下午</span>
          </label>
        </div>
      </div>

      <!-- 身份認證區塊 -->
      <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-5 space-y-4">
        <p class="text-sm font-semibold text-yellow-700">🔐 志工身份認證</p>
        <p class="text-xs text-yellow-600">為保障長者安全，請上傳身分證或良民證以完成認證。資料僅供平台審核使用。</p>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            上傳身分證（正面）<span class="text-red-500">*</span>
          </label>
          <div id="idDropZone"
               class="border-2 border-dashed border-yellow-300 rounded-xl p-6 text-center cursor-pointer hover:border-yellow-400 hover:bg-yellow-100 transition"
               onclick="document.getElementById('idFile').click()">
            <div class="text-3xl mb-2">📄</div>
            <p class="text-sm text-gray-500">點擊選擇檔案，或將檔案拖曳至此</p>
            <p class="text-xs text-gray-400 mt-1">支援 JPG、PNG、PDF</p>
            <p id="idFileName" class="text-xs text-blue-600 mt-2 font-medium"></p>
          </div>
          <input type="file" id="idFile" accept=".jpg,.jpeg,.png,.pdf" class="hidden" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">良民證（選填）</label>
          <div class="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center cursor-pointer hover:border-gray-300 transition"
               onclick="document.getElementById('certFile').click()">
            <p class="text-sm text-gray-400">點擊選擇良民證（選填）</p>
            <p id="certFileName" class="text-xs text-blue-600 mt-1 font-medium"></p>
          </div>
          <input type="file" id="certFile" accept=".jpg,.jpeg,.png,.pdf" class="hidden" />
        </div>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-3 text-sm transition">
        送出志工登記
      </button>
    </form>
  </main>

  <!-- 成功提示 -->
  <div id="successModal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 text-center shadow-xl">
      <div class="text-5xl mb-4">🙌</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">登記完成！</h2>
      <p class="text-sm text-gray-500 mb-2">您的資料已送出，身份認證審核中。</p>
      <p class="text-xs text-yellow-600 bg-yellow-50 rounded-lg px-3 py-2 mb-6">⏳ 認證通過後，系統將自動進行配對。</p>
      <div class="flex gap-3">
        <a href="match-result.html"
           class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl py-2 text-sm transition text-center">
          查看配對結果
        </a>
        <button onclick="document.getElementById('successModal').classList.add('hidden')"
           class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-xl py-2 text-sm transition">
          確認
        </button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    // 顯示已選檔案名稱
    document.getElementById('idFile').addEventListener('change', function() {
      document.getElementById('idFileName').textContent = this.files[0]?.name || '';
    });
    document.getElementById('certFile').addEventListener('change', function() {
      document.getElementById('certFileName').textContent = this.files[0]?.name || '';
    });

    document.getElementById('volunteerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name    = document.getElementById('volName').value.trim();
      const phone   = document.getElementById('volPhone').value.trim();
      const services = [...document.querySelectorAll('input[name="volService"]:checked')].map(el => el.value);
      const times    = [...document.querySelectorAll('input[name="volTime"]:checked')].map(el => el.value);
      const hasId    = document.getElementById('idFile').files.length > 0;

      if (!name)  { alert('請填寫姓名'); return; }
      if (!phone) { alert('請填寫聯絡電話'); return; }
      if (services.length === 0) { alert('請至少選擇一項可提供的服務'); return; }
      if (times.length === 0)    { alert('請至少選擇一個可配合的時段'); return; }
      if (!hasId) { alert('請上傳身分證以完成認證'); return; }

      const record = {
        id: 'V_' + Date.now(),
        name, phone, services, times,
        verified: false,   // Demo：模擬認證中
        createdAt: new Date().toISOString(),
      };
      const list = loadFromStorage('volunteers', []);
      list.unshift(record);
      saveToStorage('volunteers', list);
      e.target.reset();
      document.getElementById('idFileName').textContent = '';
      document.getElementById('certFileName').textContent = '';
      document.getElementById('successModal').classList.remove('hidden');
    });
  </script>
</body>
</html>
