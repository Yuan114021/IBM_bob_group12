<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配對結果 — 社區關懷平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/utils.js"></script>
  <script>document.addEventListener('DOMContentLoaded', applyGlobalFontSize);</script>
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="text-lg font-bold text-blue-600">🏘️ 社區關懷平台</a>
      <a href="matching.html" class="text-sm text-gray-500 hover:text-blue-600">← 返回媒合首頁</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">配對結果</h1>
    <p class="text-sm text-gray-500 mb-8">根據服務項目與時段交集，以下為目前的配對組合。</p>

    <!-- 統計列 -->
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
        <div class="text-2xl font-bold text-blue-600" id="statElders">0</div>
        <div class="text-xs text-gray-500 mt-1">登記長者</div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
        <div class="text-2xl font-bold text-green-600" id="statVolunteers">0</div>
        <div class="text-xs text-gray-500 mt-1">登記志工</div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-4 text-center">
        <div class="text-2xl font-bold text-purple-600" id="statMatches">0</div>
        <div class="text-xs text-gray-500 mt-1">成功配對</div>
      </div>
    </div>

    <!-- 配對清單 -->
    <div id="matchList" class="space-y-4"></div>

    <!-- 未配對長者 -->
    <div id="unmatchedSection" class="hidden mt-10">
      <h2 class="text-base font-semibold text-gray-600 mb-3">⏳ 尚待配對的長者</h2>
      <div id="unmatchedList" class="space-y-3"></div>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/matching.js"></script>
</body>
</html>
